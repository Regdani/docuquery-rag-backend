# Local mode (default):   docker compose up --build -d
# Cloud mode (no Ollama): docker compose --profile cloud up --build -d app-cloud
# Both app services publish port 8000, so run only one of them at a time.

x-app: &app
  build: .
  # Every app setting, including the provider, comes from .env.
  env_file:
    - path: .env
      required: true
  ports:
    - "${APP_PORT:-8000}:8000"
  volumes:
    - index:/app/data/index
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 20s
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      # Overrides any value from .env: inside compose Ollama is reachable by service name.
      OLLAMA_BASE_URL: http://ollama:11434
      INDEX_DIR: /app/data/index
    depends_on:
      # The app starts (and indexes) only after the models are available.
      ollama-pull:
        condition: service_completed_successfully

  # Same image as `app`, without the Ollama dependency.
  app-cloud:
    <<: *app
    profiles: ["cloud"]
    environment:
      INDEX_DIR: /app/data/index

  ollama:
    image: ollama/ollama:0.12.6
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    # Optional NVIDIA GPU passthrough: see the README.

  # One-shot job: pulls the Ollama models named in .env, for the parts (chat, embeddings) that
  # use Ollama. Already downloaded models are kept in the `ollama` volume and only checked.
  ollama-pull:
    image: ollama/ollama:0.12.6
    env_file:
      - path: .env
        required: true
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        llm=$$(echo "$${LLM_PROVIDER:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
        emb=$$(echo "$${EMBEDDING_PROVIDER:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
        if [ "$$llm" = "ollama" ]; then ollama pull "$${OLLAMA_CHAT_MODEL:-llama3.2:3b}"; fi
        if [ "$$emb" = "ollama" ]; then ollama pull "$${EMBEDDING_MODEL}"; fi
        echo "Ollama models are ready"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  index:
  ollama:
